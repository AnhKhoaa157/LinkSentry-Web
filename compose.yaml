# LinkSentry — local development infrastructure.
#
# This file provisions PostgreSQL for local development only. The credentials
# below are deliberately obvious local-only placeholders; they are not secrets
# and must never be reused in a deployed environment.
#
#   docker compose up -d db
#   docker compose ps
#   docker compose down
#
# The backend and frontend services are opt-in via profiles so that the common
# workflow (run Postgres in Docker, run the API and Vite from the IDE) stays fast:
#
#   docker compose --profile backend up -d
#   docker compose --profile backend --profile frontend up -d --build
#
# The frontend depends on the backend's healthcheck, so the `frontend` profile is
# only useful together with the `backend` profile.

name: linksentry

services:
  db:
    image: postgres:17-alpine
    container_name: linksentry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linksentry}
      POSTGRES_USER: ${POSTGRES_USER:-linksentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      # Keeps initdb deterministic across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Bound to loopback so the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-linksentry} -d ${POSTGRES_DB:-linksentry}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    profiles: ["backend"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linksentry-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-linksentry}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-linksentry}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time. This is the origin the browser
        # uses, so it is the backend's published host port — not `http://backend`,
        # which only resolves inside the Compose network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: linksentry-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Loopback only, and 5173 by default so the origin already present in
      # CORS_ALLOWED_ORIGINS keeps working without a policy change.
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves `localhost` to ::1 first
      # and nginx listens on IPv4 only, so the name form fails a working server.
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
    name: linksentry-db-data
