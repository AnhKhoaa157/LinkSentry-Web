# LinkSentry API — base configuration.
#
# Every environment-specific value reads from an environment variable with a
# local-development default, so a deployment overrides configuration without
# editing this file. Nothing here is a secret.

spring:
  application:
    name: linksentry-api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linksentry}
    username: ${SPRING_DATASOURCE_USERNAME:linksentry}
    password: ${SPRING_DATASOURCE_PASSWORD:local-development-only}
    hikari:
      pool-name: linksentry-pool
      maximum-pool-size: 10
  jpa:
    # Lazy loading outside a transaction hides N+1 queries; keep it off.
    open-in-view: false
    hibernate:
      # Schema ownership belongs to Flyway. Hibernate never alters it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    # Nothing internal reaches the client. See docs/SECURITY_BOUNDARY.md.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        # Only health. Do not widen this without deciding who may reach it.
        include: health
  endpoint:
    health:
      # Component detail would disclose infrastructure to anyone probing.
      show-details: never
      show-components: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

linksentry:
  engine:
    # Reported in every scan response so a shared or stored result can be
    # interpreted correctly after the rules or scoring bands change.
    version: ${ENGINE_VERSION:0.1.0}
  history:
    # A licensed device can retrieve safe result snapshots for this many days.
    retention-days: ${HISTORY_RETENTION_DAYS:30}
  license:
    # Used when an admin creates a license without specifying maxDevices. The
    # documented default is one web installation plus one extension installation.
    default-max-devices: ${LICENSE_DEFAULT_MAX_DEVICES:2}
    # A device installation that POST /api/v1/devices created but that was never
    # assigned to any license is deleted
    # this long after creation, bounding unbounded table growth from that public,
    # unauthenticated endpoint. A device with any assignment history — even a
    # revoked one — is never deleted regardless of age. See
    # license.application.DevicePendingRetentionService.
    pending-device-retention: ${LICENSE_PENDING_DEVICE_RETENTION:30d}
  admin:
    # Optional operator credential for /api/v1/admin/**. Never exposed to
    # the frontend or extension. Blank disables only the API-key path; browser admin
    # sessions remain valid. See
    # common.security.AdminApiKeyFilter and docs/SECURITY_BOUNDARY.md.
    api-key: ${ADMIN_API_KEY:}
  admin-auth:
    # A human administrator's own browser login for the protected /admin dashboard
    # (admin.* package) — wholly separate from linksentry.admin's ADMIN_API_KEY
    # above and from the removed end-user account model. Bootstrap creates exactly
    # one admin_user row the first time the backend starts with none yet; leaving
    # either value blank does not fail startup — bootstrap is skipped and every
    # login attempt then fails with the same safe invalid-credentials response
    # until both are set and the backend restarts with still no admin present.
    # Never logged, returned, or persisted raw — only the BCrypt hash is stored.
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    # Admin login session lifetime.
    session-ttl: ${ADMIN_SESSION_TTL:30m}
  cors:
    # Exact origins only. A wildcard is never acceptable here.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,OPTIONS
  ratelimit:
    # Single-instance, in-memory token buckets keyed only by remote address. See
    # common.ratelimit and docs/SECURITY_BOUNDARY.md.
    enabled: ${RATE_LIMIT_ENABLED:true}
    scan:
      capacity: ${RATE_LIMIT_SCAN_CAPACITY:20}
      refill-per-minute: ${RATE_LIMIT_SCAN_REFILL_PER_MINUTE:10}
    scan-lookup:
      capacity: ${RATE_LIMIT_SCAN_LOOKUP_CAPACITY:30}
      refill-per-minute: ${RATE_LIMIT_SCAN_LOOKUP_REFILL_PER_MINUTE:60}
    device:
      # Device bootstrap/status routes get a separate, deliberately stricter
      # per-remote-address bucket than URL analysis.
      capacity: ${RATE_LIMIT_DEVICE_CAPACITY:5}
      refill-per-minute: ${RATE_LIMIT_DEVICE_REFILL_PER_MINUTE:5}
    explanation:
      # The costliest route: each request pays for an outbound Anthropic call.
      # Deliberately the strictest bucket.
      capacity: ${RATE_LIMIT_EXPLANATION_CAPACITY:5}
      refill-per-minute: ${RATE_LIMIT_EXPLANATION_REFILL_PER_MINUTE:2}
    admin:
      # /api/v1/admin/** is an admin surface for browser sessions and operators,
      # but still rate limited so a leaked or brute-forced ADMIN_API_KEY attempt
      # cannot be hammered freely.
      capacity: ${RATE_LIMIT_ADMIN_CAPACITY:10}
      refill-per-minute: ${RATE_LIMIT_ADMIN_REFILL_PER_MINUTE:10}
    admin-auth-login:
      # Strict per-address bucket for POST /api/v1/admin-auth/login only — a human
      # administrator's browser login, independent of the admin bucket above.
      capacity: ${RATE_LIMIT_ADMIN_AUTH_LOGIN_CAPACITY:5}
      refill-per-minute: ${RATE_LIMIT_ADMIN_AUTH_LOGIN_REFILL_PER_MINUTE:5}
    store:
      # Hard cap on tracked addresses per route, plus how long an idle address is
      # kept before its bucket is swept — bounds memory against an attacker who
      # spreads requests across many distinct source addresses.
      max-entries: ${RATE_LIMIT_STORE_MAX_ENTRIES:10000}
      idle-expiration: ${RATE_LIMIT_STORE_IDLE_EXPIRATION:10m}
  anonymous-trial:
    # Persistent, device-scoped rolling-window trial quota for POST /api/v1/scans
    # from a device that is not currently licensed (ADR 0010), independent of
    # linksentry.ratelimit's general anti-abuse control, which still applies on
    # top of this. Quota state is PostgreSQL-persisted by device_id; there is no
    # in-memory identity store left to bound. See common.trial,
    # common.trial.persistence, and docs/SECURITY_BOUNDARY.md.
    enabled: ${ANONYMOUS_TRIAL_ENABLED:true}
    max-scans: ${ANONYMOUS_TRIAL_MAX_SCANS:3}
    window: ${ANONYMOUS_TRIAL_WINDOW:24h}
  ai-explanation:
    # Optional, disabled-by-default AI explanation for a licensed device's own
    # retained scan (POST /api/v1/scans/{scanId}/explanation). AI is advisory
    # only — it never decides score, risk level, findings, persistence, or
    # access control. See explanation.* and
    # docs/adr/0005-anthropic-scan-explanation-integration.md.
    enabled: ${AI_EXPLANATIONS_ENABLED:false}
    anthropic:
      # Secret. Never set a real value here — only through the environment.
      api-key: ${ANTHROPIC_API_KEY:}
      # Never client-controlled; selected only by this configuration.
      model: ${ANTHROPIC_MODEL:}
  rules:
    # Tunable thresholds and word lists for analysis.rules. Changing these is a
    # scoring-policy decision, not a code change.
    excessive-url-length:
      max-length: 100
    excessive-subdomains:
      max-depth: 3
    suspicious-keywords:
      keywords: login,verify,secure,account,update,confirm,signin,banking,password,billing
    known-url-shorteners:
      domains: bit.ly,tinyurl.com,t.co,goo.gl,ow.ly,is.gd,buff.ly,adf.ly,rebrand.ly,cutt.ly,shorturl.at,rb.gy
  brands:
    # Curated brand registry for BRAND_DOMAIN_MISMATCH: hand-maintained data, never
    # runtime discovery. Order is significant — it breaks ties when a hostname's
    # tokens match more than one configured brand. See BrandRegistry's javadoc and
    # docs/SECURITY_BOUNDARY.md.
    # Provenance: each domain below is the brand's own primary web/banking
    # domain, hand-verified against the brand's own published contact/login
    # pages at curation time (2026-08-18) — never a runtime lookup, a
    # crowd-sourced list, or a guess from the brand's name. Tokens are the
    # brand's distinctive name only; no generic word (bank, secure, login,
    # pay) is ever added as a token. Adding, removing, or re-verifying an
    # entry is a manual pull request, not a config toggle.
    entries:
      - id: vietcombank
        display-name: Vietcombank
        tokens: vietcombank
        official-domains: vietcombank.com.vn
      - id: techcombank
        display-name: Techcombank
        tokens: techcombank
        official-domains: techcombank.com.vn
      - id: bidv
        display-name: BIDV
        tokens: bidv
        official-domains: bidv.com.vn
      - id: vietinbank
        display-name: VietinBank
        tokens: vietinbank
        official-domains: vietinbank.vn
      - id: agribank
        display-name: Agribank
        tokens: agribank
        official-domains: agribank.com.vn
      - id: acb
        display-name: ACB
        tokens: acb
        official-domains: acb.com.vn
      - id: sacombank
        display-name: Sacombank
        tokens: sacombank
        official-domains: sacombank.com.vn
      - id: momo
        display-name: MoMo
        tokens: momo
        official-domains: momo.vn
      - id: shopee
        display-name: Shopee
        tokens: shopee
        official-domains: shopee.vn
      - id: tiki
        display-name: Tiki
        tokens: tiki
        official-domains: tiki.vn

logging:
  level:
    root: INFO
    com.lyanhkhoa.linksentry: INFO
  pattern:
    # No MDC dump and no request parameters: submitted URLs must never be logged.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
