# Test profile.
#
# Uses in-memory H2 for context-loading and web-layer tests. The complete
# `./gradlew test` suite also includes PostgreSQL Testcontainers tests and does
# require Docker; targeted non-repository tests can still run without it.
#
# It is NOT adequate for verifying SQL. H2 does not share PostgreSQL's dialect,
# column types, or constraint behaviour, so the repository tests of Exercise 10
# must use Testcontainers PostgreSQL instead (already on the test classpath).

spring:
  datasource:
    url: jdbc:h2:mem:linksentry;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    # PostgreSQL migrations are exercised by the Testcontainers integration suite;
    # the H2 test profile is reserved for context-loading and web-layer tests.
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

linksentry:
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,OPTIONS

logging:
  level:
    root: WARN
    com.lyanhkhoa.linksentry: INFO
