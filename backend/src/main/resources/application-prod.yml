# Production profile: the Docker image runs it unless SPRING_PROFILES_ACTIVE
# says otherwise (see backend/Dockerfile). Docker Compose keeps using `local`.
#
# Environment-specific values still come from environment variables in
# application.yml. This file only pins production policy.

springdoc:
  # API docs and Swagger UI never ship to production. The base configuration
  # already turns them off; repeating it here keeps production safe even if
  # that default changes.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

linksentry:
  client-address:
    # Render serves the API through Cloudflare, which overwrites
    # CF-Connecting-IP with the visitor's address. Without this, every visitor
    # shares the proxy's address and therefore the same rate-limit buckets.
    # Set CLIENT_ADDRESS_HEADER to an empty value on a host without Cloudflare.
    trusted-header: ${CLIENT_ADDRESS_HEADER:CF-Connecting-IP}

logging:
  level:
    com.lyanhkhoa.linksentry: INFO
