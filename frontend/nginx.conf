# LinkSentry web client — static file serving only.
#
# There is deliberately no `proxy_pass` and no `/api` location. The browser calls
# the API's own origin directly, exactly as it does in development, which is what
# keeps the backend's CORS allow-list a real control rather than a formality.
# Adding a proxy here would silently make every request same-origin and hide a
# misconfigured CORS policy until deployment.
#
# Every writable path is redirected under /tmp and the listen port is above 1024,
# so the whole server runs as the unprivileged `nginx` user.

worker_processes  auto;
pid               /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Defaults live under /var/cache/nginx, which a non-root process cannot write.
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    access_log  /dev/stdout;
    error_log   /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;

    server {
        listen      8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Vite emits every build artifact hashed under /assets/. These must 404
        # when absent: without this exception the SPA fallback below would answer
        # a missing script with index.html and a 200, and the browser would try
        # to execute HTML as JavaScript.
        location /assets/ {
            try_files $uri =404;
        }

        # React Router owns the client-side routes, so an unknown path such as
        # /scans/<uuid> must receive index.html instead of a 404 and let the
        # router resolve it in the browser.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
