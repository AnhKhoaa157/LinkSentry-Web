<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LinkSentry analyses suspicious links as text and explains what looks wrong. It never visits the URL you submit."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7fb" />
    <link rel="icon" data-app-favicon href="/brand/linksentry-mark.png" />
    <script>
      try {
        const storedTheme = localStorage.getItem('linksentry.theme');
        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.classList.add(theme);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#05080f' : '#f4f7fb');
        document
          .querySelector('link[data-app-favicon]')
          ?.setAttribute(
            'href',
            theme === 'dark' ? '/brand/linksentry-mark-white.png' : '/brand/linksentry-mark.png',
          );
      } catch {
        document.documentElement.classList.add('light');
      }
    </script>
    <title>LinkSentry — Explainable phishing URL analysis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
