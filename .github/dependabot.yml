# Weekly or monthly update pull requests for every dependency manifest in the
# repository. Minor and patch updates are grouped per ecosystem to keep the
# number of pull requests small. Security updates arrive regardless of schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    ignore:
      # The images track LTS lines (Java 25, Node 24). Moving to the next major
      # runtime is a deliberate change, not a routine bump.
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
