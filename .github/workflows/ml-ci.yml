name: ML CI

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - '.github/workflows/ml-ci.yml'
  pull_request:
    paths:
      - 'ml/**'
      - '.github/workflows/ml-ci.yml'
  workflow_dispatch:

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ml/requirements.txt

      # Same command as the README. The suite is offline: no fetch, no DNS.
      - name: Test
        run: python -m unittest discover -s ml/tests
